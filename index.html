<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Central Cobranças e Custos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --bg:#f3f5f8;--paper:#ffffff;--ink:#17202f;--muted:#6b7488;--faint:#a3abba;--line:#e8ebf1;
  --navy:#0e1c3a;--accent:#1569e0;--accent-s:#eaf2fd;
  --green:#1f9254;--green-s:#e9f6ee;--red:#d6453f;--red-s:#fbecec;
  --f:'Montserrat',-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1120;--paper:#141c2d;--ink:#e9eef7;--muted:#8792a6;--faint:#5c6782;--line:#202a3c;
  --accent:#4a93f0;--accent-s:#152440;--green:#49b574;--green-s:#122a1d;--red:#e06a65;--red-s:#2b1716;color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0b1120;--paper:#141c2d;--ink:#e9eef7;--muted:#8792a6;--faint:#5c6782;--line:#202a3c;--accent:#4a93f0;--accent-s:#152440;--green:#49b574;--green-s:#122a1d;--red:#e06a65;--red-s:#2b1716;color-scheme:dark;}
*{box-sizing:border-box}
button,.fi,select,input,textarea,.stsel,.chip,.tb,.ct{touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;line-height:1.5}
h1,h2,h3{margin:0;font-weight:700}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hd{padding:22px 0 0}
.hd .top{display:flex;align-items:center;gap:13px;flex-wrap:wrap}
.hd img{height:40px;width:auto}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .hd img{filter:invert(1) brightness(1.7)}}
:root[data-theme="dark"] .hd img{filter:invert(1) brightness(1.7)}
.hd .ti{font-size:20px;font-weight:800;letter-spacing:-.01em}
.hd .ti small{display:block;font-weight:500;font-size:12px;color:var(--muted);margin-top:3px;letter-spacing:0}
.hd .sp{flex:1}
.hd .search input{padding:9px 14px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:13.5px;outline:none;width:190px;max-width:42vw}
.hd .search input:focus{border-color:var(--accent)}
.btn-new{background:var(--accent);color:#fff;border:none;font-family:var(--f);font-weight:600;font-size:13.5px;padding:9px 15px;border-radius:9px;cursor:pointer;white-space:nowrap}
.tabbar{display:flex;gap:4px;margin-top:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabbar::-webkit-scrollbar{display:none}
.tb{font-weight:600;font-size:14px;padding:11px 14px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tb.on{color:var(--accent);border-bottom-color:var(--accent)}
.body{padding:20px 0 60px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{font-weight:600;font-size:12.5px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:var(--paper);color:var(--muted);cursor:pointer}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}
.kc{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.kc .l{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kc .n{font-size:25px;font-weight:800;margin-top:7px;letter-spacing:-.01em}
.kc .s{font-size:11.5px;color:var(--faint);margin-top:4px}
.kc.g .n{color:var(--green)}.kc.r .n{color:var(--red)}.kc.b .n{color:var(--accent)}
@media(max-width:720px){.kpis{grid-template-columns:repeat(2,1fr)}}
.cols{display:grid;grid-template-columns:1.3fr 1fr;gap:14px}
@media(max-width:820px){.cols{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:18px 20px}
.panel .ph{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:14px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.leg{flex:1;min-width:150px;display:flex;flex-direction:column;gap:7px}
.leg .row{display:flex;align-items:center;gap:8px;font-size:13px}
.leg .dot{width:10px;height:10px;border-radius:3px;flex:none}
.leg .nm{flex:1}.leg .vv{font-weight:600;color:var(--muted)}
.frow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.frow:last-child{border-bottom:none}.frow .vv{font-weight:700}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar select{padding:8px 12px;border:1px solid var(--line);border-radius:9px;background:var(--paper);color:var(--ink);font-family:var(--f);font-size:13px;outline:none}
.tbl{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.tr{display:grid;grid-template-columns:78px 1fr 130px 90px 110px;gap:10px;padding:11px 15px;border-bottom:1px solid var(--line);align-items:center;font-size:13px;cursor:pointer}
.tr:hover{background:var(--bg)}
.tr.h{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--bg);cursor:default}
.tr.h:hover{background:var(--bg)}
.tr:last-child{border-bottom:none}
.tr .dt{color:var(--muted);font-size:12px}
.tr .ds{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tr .pill2{font-size:10.5px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--bg);color:var(--muted);justify-self:start;white-space:nowrap}
.tr .em{font-size:11.5px;color:var(--muted)}
.tr .am{text-align:right;font-weight:700}.tr .am.e{color:var(--green)}.tr .am.s{color:var(--red)}
@media(max-width:720px){.tr{grid-template-columns:62px 1fr 96px}.tr .pill2,.tr .em,.tr .hc,.tr .hf{display:none}}
/* clientes */
.ctbl{background:var(--paper);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.crow{display:grid;grid-template-columns:1fr 158px;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);align-items:center}
.crow.h{font-size:10.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;background:var(--bg)}
.crow:last-child{border-bottom:none}
.cl-main{cursor:pointer;min-width:0}
.cl-nm{font-weight:700;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-sub{color:var(--faint);font-size:11.5px;margin-top:1px}
.cl-meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:3px 12px}
.cl-meta b{font-weight:700;color:var(--ink)}.cl-meta .rd{color:var(--red);font-weight:600}
.stsel{font-family:var(--f);font-weight:600;font-size:12.5px;padding:8px 9px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer;outline:none;width:100%}
.stsel.s-pago{border-color:var(--green);color:var(--green)}.stsel.s-naopago,.stsel.s-urgente{border-color:var(--red);color:var(--red)}.stsel.s-permuta{border-color:#9a7fd6;color:#9a7fd6}
@media(max-width:560px){.crow{grid-template-columns:1fr 120px}}
.ctabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--line)}
.ct{font-weight:600;font-size:12.5px;padding:8px 11px;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.ct.on{color:var(--accent);border-bottom-color:var(--accent)}
.count{color:var(--faint);font-size:11px;margin:0 2px 10px;font-weight:500}
.empty,.state{text-align:center;color:var(--muted);padding:50px 20px}
.empty h3{font-size:16px;margin-bottom:6px;color:var(--ink)}
.dre{max-width:640px}
.dre .ln{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.dre .ln.sec{font-weight:700}.dre .ln.tot{font-weight:800;border-top:2px solid var(--ink);border-bottom:2px solid var(--ink);background:var(--bg);padding:12px 10px;margin-top:4px}
.dre .ln .sub{padding-left:16px;color:var(--muted);font-weight:500}
.note{background:var(--accent-s);border-radius:11px;padding:12px 15px;font-size:12.5px;color:var(--ink);margin-top:14px}
.ov{position:fixed;inset:0;background:rgba(10,18,36,.5);display:none;align-items:flex-end;justify-content:center;z-index:100}
.ov.open{display:flex}
.modal{background:var(--paper);width:100%;max-width:480px;border-radius:18px 18px 0 0;padding:22px;max-height:92vh;overflow-y:auto}
@media(min-width:560px){.ov{align-items:center}.modal{border-radius:16px}}
.modal h3{font-size:18px;margin-bottom:4px}
.mstatus{font-size:12px;font-weight:600;margin-bottom:12px}
.dgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px 14px;margin:6px 0 16px}
.di .k{font-size:10px;color:var(--faint);text-transform:uppercase}.di .v{font-size:14.5px;font-weight:600;margin-top:2px}
.pnum{display:inline-block;transition:transform .2s,color .2s}.pnum.bump{transform:scale(1.6);color:var(--green)}
.acts{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.ab{font-family:var(--f);font-weight:600;font-size:13px;padding:9px 13px;border-radius:10px;border:1px solid var(--line);background:var(--paper);color:var(--ink);cursor:pointer}
.ab:hover{background:var(--bg)}.ab.pri{background:var(--green);color:#fff;border-color:var(--green)}
.ab.del{margin-left:auto;color:var(--faint);border-color:transparent}.ab.del:hover{color:var(--red);background:var(--red-s)}
.flg{font-size:11px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.fi{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:14px;outline:none}
.fi:focus{border-color:var(--accent)}
.ff{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mbtns{display:flex;gap:10px;margin-top:18px}.mbtns button{flex:1;font-family:var(--f);font-weight:600;font-size:14px;padding:12px;border-radius:11px;border:none;cursor:pointer}
.save{background:var(--accent);color:#fff}.cancel{background:var(--bg);color:var(--muted);border:1.5px solid var(--line)!important}.del-confirm{background:var(--red);color:#fff}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:999px;font-weight:500;font-size:13px;z-index:200;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.btn-logout{background:transparent;border:1px solid var(--line);color:var(--muted);font-family:var(--f);font-weight:600;font-size:12.5px;padding:8px 12px;border-radius:9px;cursor:pointer;white-space:nowrap}
.login{position:fixed;inset:0;background:var(--bg);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}
.login.show{display:flex}
.loginbox{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:30px 26px;width:100%;max-width:360px;box-shadow:0 10px 40px rgba(10,18,36,.12)}
.lg-ti{font-size:22px;font-weight:800;letter-spacing:-.01em;line-height:1.15}
.lg-ti span{display:block;color:var(--accent);font-size:15px;font-weight:700;margin-top:2px}
.lg-p{color:var(--muted);font-size:13px;margin:8px 0 20px}
.lg-in{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:11px;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;outline:none;margin-bottom:11px}
.lg-in:focus{border-color:var(--accent)}
.lg-btn{width:100%;padding:13px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-family:var(--f);font-weight:700;font-size:15px;cursor:pointer;margin-top:4px}
.lg-err{color:var(--red);font-size:12.5px;margin-top:10px;min-height:16px;text-align:center}
</style>
</head>

async function sbw(run){let r;try{r=await withTimeout(run(),6000);}catch(e){try{await sb.auth.getSession();}catch(_){}r=await run();}if(r&&r.error)throw r.error;return r;}
function sk(s){return (s||'').toLowerCase().normalize('NFD').replace(/[^a-z0-9]/g,'');}
function brl(n){return 'R$ '+(Math.round(Number(n))||0).toLocaleString('pt-BR');}
function brlk(n){n=Number(n)||0;return n>=1000?('R$ '+(n/1000).toFixed(n>=10000?0:1).replace('.',',')+'k'):brl(n);}
function esc(s){return (s==null?'':''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function isLed(c){return sk(c.tipo)==='vendaled';}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}

function dmy(d){const p=(d||'').split('/');return p.length>=3?(p[2]+(p[1]||'').padStart(2,'0')+(p[0]||'').padStart(2,'0')):'0';}
function isoToDmy(iso){const p=(iso||'').split('-');return p.length>=3?(p[2]+'/'+p[1]+'/'+p[0]):'';}
function dmyToIso(d){const p=(d||'').split('/');return p.length>=3?(p[2]+'-'+(p[1]||'').padStart(2,'0')+'-'+(p[0]||'').padStart(2,'0')):'';}
function refreshMeses(){const s=new Set(FLUXO.map(t=>t.mes).filter(Boolean));MESES=[...s].sort();}
function ymNow(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function ymDiff(a,b){if(!a||!b)return 0;const pa=(''+a).split('-'),pb=(''+b).split('-');return (pb[0]-pa[0])*12+(pb[1]-pa[1]);}
function nextMonths(n){const out=[];const d=new Date();for(let i=1;i<=n;i++){const m=new Date(d.getFullYear(),d.getMonth()+i,1);const mm=String(m.getMonth()+1).padStart(2,'0');out.push({ym:m.getFullYear()+'-'+mm,lbl:(MES[mm]||mm)+'/'+String(m.getFullYear()).slice(2)});}return out;}

const GRUPOS=['Fixo','Investimento','Salário'];
const GCOL={fixo:'#4a7fb5',investimento:'#5aa06f',salario:'#8a6bb5'};
const EMPCOL={onpro:'#e8922e',admidia:'#1569e0',adled:'#5aa06f',adview:'#7a8595'};
function setCClasse(c){cClasse=c;renderCustos();}
function setCPeriodo(v){cPeriodo=v;renderCustos();}
function monthOpts(n){const out=[];const d=new Date();for(let i=0;i<n;i++){const m=new Date(d.getFullYear(),d.getMonth()+i,1);const mm=String(m.getMonth()+1).padStart(2,'0');out.push({ym:m.getFullYear()+'-'+mm,lbl:(MES[mm]||mm)+'/'+String(m.getFullYear()).slice(2),k:i});}return out;}
function custoAtivoK(c,k){if(c.fim)return false;if(c.grupo==='Investimento'&&(+c.tt||0)>0)return ((+c.tt||0)-(+c.pg||0))>k;return true;}
function custoLate(c){if(c.fim)return 0;const d=+c.venc||0,today=new Date().getDate(),ml=Math.max(0,ymDiff(c.mespg,ymNow()));if(ml>=1)return ml;if(d&&today>d&&(c.mespg||'')<ymNow())return 1;return 0;}
function custoEmpresa(list){const e={};list.forEach(c=>{const v=+c.valor||0;if(c.emp2&&c.emp2!=='Não'&&c.emp2!==''&&c.emp2!==c.emp){const p=(c.ppri!=null?+c.ppri:50)/100;e[c.emp||'—']=(e[c.emp||'—']||0)+v*p;e[c.emp2]=(e[c.emp2]||0)+v*(1-p);}else{const k=c.emp||'—';e[k]=(e[k]||0)+v;}});return e;}
function statusCusto(c){if(c.mespg===ymNow())return 'Pago';if(custoLate(c)>=1)return 'Atrasado';if(sk(c.status)==='urgente')return 'Urgente';return 'Em aberto';}
function custoStatusSel(c){const s=statusCusto(c),sc=sk(s);let opts=(s==='Atrasado'?'<option selected>Atrasado</option>':'')+['Pago','Em aberto','Urgente'].map(o=>'<option'+((s!=='Atrasado'&&o===s)?' selected':'')+'>'+o+'</option>').join('');const cls=sc==='pago'?'s-pago':((sc==='atrasado'||sc==='urgente')?'s-naopago':'');return '<select class="stsel '+cls+'" onclick="event.stopPropagation()" onchange="setCustoStatus(\''+c.id+'\',this.value)">'+opts+'</select>';}
async function setCustoStatus(id,val){const c=CUSTOS.find(x=>x.id===id);if(!c)return;if(val==='Atrasado')return;try{if(val==='Pago'){const tt=+c.tt||0,was=c.mespg===ymNow(),pg=(!was&&tt>0)?Math.min((+c.pg||0)+1,tt):(+c.pg||0);await sbw(()=>sb.from('custos').update({status:'Pago',mespg:ymNow(),pg:pg}).eq('id',id));toast('Pago'+(tt>0?' '+pg+'/'+tt:''));}else{await sbw(()=>sb.from('custos').update({status:val,mespg:null}).eq('id',id));toast(val);}await loadCustos();}catch(e){toast('Erro ao salvar');}}
function custoRow(c){
  const pc=(+c.tt>0)?((+c.pg||0)+'/'+(+c.tt)):'';
  const emp=(c.emp2&&c.emp2!=='Não'&&c.emp2!==''&&c.emp2!==c.emp)?(c.emp+' / '+c.emp2):(c.emp||'');
  const m=['<span><b>'+brl(c.valor)+'</b></span>'];
  if(c.venc)m.push('<span>venc dia '+c.venc+'</span>');
  if(pc)m.push('<span><b style="color:var(--accent)">'+pc+'</b> parc</span>');
  m.push('<span>'+esc(emp)+'</span>');
  if(c.obs)m.push('<span>📝</span>');
  return '<div class="crow"><div class="cl-main" onclick="openCustoForm(\''+c.id+'\')"><div class="cl-nm">'+esc(c.fornecedor||c.descricao)+'</div><div class="cl-sub">'+esc(c.descricao||'')+'</div><div class="cl-meta">'+m.join('')+'</div></div>'+custoStatusSel(c)+'</div>';
}
function custosList(list){return '<div class="ctbl"><div class="crow h"><span>Custo · por vencimento</span><span>Status</span></div>'+(list.length?list.map(custoRow).join(''):'<div class="empty">Nada aqui. Clica em <b>+ Custo</b>.</div>')+'</div>';}
function renderCustos(){
  if(sb&&!custoLoaded){document.getElementById('content').innerHTML='<div class="state">Carregando custos…</div>';return;}
  const q=sk(document.getElementById('q').value||'');
  const per=cPeriodo||ymNow();const k=Math.max(0,ymDiff(ymNow(),per));
  const CF=[['todos','Todos'],['Fixo','Fixo'],['Investimento','Investimento'],['Salário','Salário'],['fim','Encerradas'],['invisivel','Custo invisível']];
  const chips='<div class="chips">'+CF.map(f=>'<div class="chip '+(cClasse===f[0]?'on':'')+'" onclick="setCClasse(\''+f[0]+'\')">'+f[1]+'</div>').join('')+'</div>';
  if(cClasse==='invisivel')return renderInvisivel(chips);
  if(cClasse==='fim'){
    let list=CUSTOS.filter(c=>c.fim).filter(c=>!q||sk(c.fornecedor).includes(q)||sk(c.descricao).includes(q));
    list.sort((a,b)=>dmy(b.data).localeCompare(dmy(a.data)));
    const total=list.reduce((a,c)=>a+(+c.valor||0),0);
    document.getElementById('content').innerHTML=chips+'<div class="count">'+list.length+' encerradas/quitadas</div>'+custosList(list);return;
  }
  const months=monthOpts(7);
  const psel='<div class="chips"><span style="font-size:12px;color:var(--muted);align-self:center;margin-right:2px">Período:</span><select class="stsel" style="width:auto;padding:7px 11px" onchange="setCPeriodo(this.value)">'+months.map(m=>'<option value="'+m.ym+'"'+(per===m.ym?' selected':'')+'>'+m.lbl+'</option>').join('')+'</select></div>';
  const base=CUSTOS.filter(c=>custoAtivoK(c,k));
  const tot=g=>base.filter(c=>c.grupo===g).reduce((a,c)=>a+(+c.valor||0),0);
  const totalMes=tot('Fixo')+tot('Investimento')+tot('Salário');
  let list=base.filter(c=>cClasse==='todos'||c.grupo===cClasse).filter(c=>!q||sk(c.fornecedor).includes(q)||sk(c.descricao).includes(q)||sk(c.emp).includes(q));
  list.sort((a,b)=>((a.venc||99)-(b.venc||99))||((+b.valor||0)-(+a.valor||0)));
  const kcard=(g,lbl)=>{const col=GCOL[sk(g)]||'var(--ink)';return '<div class="kc"><div class="l">'+lbl+'</div><div class="n" style="color:'+col+';font-size:20px">'+brlk(tot(g))+'</div></div>';};
  const kpis='<div class="kpis">'+kcard('Fixo','Fixo')+kcard('Investimento','Investimento')+kcard('Salário','Salário')+'<div class="kc"><div class="l">Total / mês</div><div class="n b" style="font-size:20px">'+brlk(totalMes)+'</div></div></div>';
  let extra='';
  if(cClasse==='todos'){
    const e=custoEmpresa(base);const arr=Object.entries(e).map(([k,v])=>({k,v})).sort((a,b)=>b.v-a.v);arr.forEach((x,i)=>x.c=EMPCOL[sk(x.k)]||PAL[i%PAL.length]);
    extra+='<div class="panel" style="margin-bottom:14px"><div class="ph">Custo por empresa · total '+brl(totalMes)+'</div><div class="donut-wrap">'+donut(arr,totalMes)+'<div class="leg">'+(arr.length?arr.map(x=>'<div class="row"><span class="dot" style="background:'+x.c+'"></span><span class="nm">'+esc(x.k)+'</span><span class="vv">'+brl(x.v)+'</span></div>').join(''):'<span style="color:var(--faint)">—</span>')+'</div></div></div>';
    extra+=projecaoCustos();
  }
  const resumo='<div class="count">'+list.length+' custos · '+(months.find(m=>m.ym===per)||{lbl:''}).lbl+'</div>';
  document.getElementById('content').innerHTML=psel+chips+kpis+extra+resumo+custosList(list);
}
function projecaoCustos(){
  const fut=monthOpts(6);
  const projs=fut.map(f=>{const b=CUSTOS.filter(c=>custoAtivoK(c,f.k));return {lbl:f.lbl,v:b.reduce((a,c)=>a+(+c.valor||0),0)};});
  const maxv=Math.max.apply(null,projs.map(p=>p.v).concat([1]));

/* CLIENTES */
function cmatch(c){const s=sk(c.status);if(cfiltro==='todos')return !isLed(c)&&s!=='permuta';if(cfiltro==='atrasados')return s==='naopago'||s==='urgente';if(cfiltro==='emaberto')return s==='emaberto';if(cfiltro==='pago')return s==='pago';if(cfiltro==='permuta')return s==='permuta';if(cfiltro==='led')return isLed(c);return true;}
const CFILT=[['todos','Todos'],['atrasados','Precisa cobrar'],['emaberto','Aguardando'],['pago','Em dia'],['permuta','Permuta'],['led','ADled']];
function setCF(f){cfiltro=f;renderClientes();}
function crow(c){
  const s=sk(c.status),pg=+c.pg||0,tt=+c.tt||0,d=parseInt(c.venc)||0,atr=(s==='naopago'||s==='urgente');
  const late=(['naopago','urgente','emaberto'].includes(s))?Math.max(0,ymDiff(c.mespg,ymNow())):0;
  let m=[];
  if(late>=1)m.push('<span class="rd" style="font-weight:700">⚠ '+late+(late>1?' meses':' mês')+' em atraso</span>');
  if(c.valor)m.push('<span><b>'+brl(c.valor)+'</b>/mês</span>');
  if(tt>0)m.push('<span>'+(pg>=tt?('♻ '+pg+' meses'):(pg+'/'+tt+' parcelas'))+'</span>');
  if(s==='pago')m.push('<span style="color:var(--green)">pago ✓</span>');else if(d&&s!=='permuta')m.push('<span class="'+(atr?'rd':'')+'">'+(atr?'venceu dia '+d:'vence dia '+d)+'</span>');
  if(c.forma)m.push('<span>'+esc(c.forma)+'</span>');
  if(c.contrato)m.push('<span>contrato '+esc(c.contrato)+'</span>');
  const opts=STATUSES.map(o=>'<option '+(sk(o)===s?'selected':'')+'>'+o+'</option>').join('');
  const st=CANW?'<select class="stsel s-'+s+'" onchange="setStSel(\''+c.id+'\',this.value)">'+opts+'</select>':'<span>'+(LABEL[s]||esc(c.status))+'</span>';
  return '<div class="crow"><div class="cl-main" onclick="openDetail(\''+c.id+'\')"><div class="cl-nm">'+esc(c.empresa)+'</div><div class="cl-sub">'+esc(c.cidade||'')+(c.seg?' · '+esc(c.seg):'')+'</div><div class="cl-meta">'+m.join('')+'</div></div>'+st+'</div>';
}
function renderClientes(){
  if(!DB){document.getElementById('content').innerHTML='<div class="state">Carregando…</div>';return;}
  if(!cloaded){document.getElementById('content').innerHTML='<div class="state">Carregando clientes…</div>';return;}
  const q=sk(document.getElementById('q').value||'');
  let list=CLIENTES.filter(cmatch).filter(c=>!q||sk(c.empresa).includes(q)||sk(c.cidade).includes(q));
  list.sort((a,b)=>((parseInt(a.venc)||99)-(parseInt(b.venc)||99))||sk(a.empresa).localeCompare(sk(b.empresa)));
  let bd=!CLIENTES.length?'<div class="empty"><h3>Nenhum cliente</h3>Clica em <b>+ Cliente</b>.</div>':!list.length?'<div class="empty"><h3>Nada nesse filtro ✓</h3></div>':'<div class="count">'+list.length+' clientes · por vencimento</div><div class="ctbl"><div class="crow h"><span>Cliente</span><span>Status</span></div>'+list.map(crow).join('')+'</div>';
  document.getElementById('content').innerHTML='<div class="ctabs">'+CFILT.map(f=>'<div class="ct '+(cfiltro===f[0]?'on':'')+'" onclick="setCF(\''+f[0]+'\')">'+f[1]+'</div>').join('')+'</div>'+bd;
}
async function setStSel(id,val){const c=CLIENTES.find(x=>x.id===id);if(!c)return;try{if(sk(val)==='pago'){const was=sk(c.status)==='pago',tt=+c.tt||0,pg=(!was&&tt>0)?Math.min((+c.pg||0)+1,tt):(+c.pg||0);await DB.collection('clientes').doc(id).update({status:'Pago',pg:pg,mespg:ymNow()});toast('Pago'+(tt>0?' '+pg+'/'+tt:''));}else{await DB.collection('clientes').doc(id).update({status:val});toast(val);}}catch(e){writeErr(e);}}
function openDetail(id){detailId=id;const c=CLIENTES.find(x=>x.id===id);if(!c)return;const s=sk(c.status),pg=+c.pg||0,tt=+c.tt||0,d=parseInt(c.venc)||0;const di=(k,v)=>'<div class="di"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>';const parcHtml=tt>0?'<span class="pnum" id="pn">'+pg+'</span> / '+tt+(pg>=tt?' ♻':''):'—';
  document.getElementById('modal').innerHTML='<h3>'+esc(c.empresa)+'</h3><div class="mstatus" style="color:'+(SCOL[s]||'var(--muted)')+'">● '+(LABEL[s]||esc(c.status))+'</div><div class="dgrid">'+di('Valor mensal',c.valor?brl(c.valor):'—')+di('Vencimento',d?('dia '+d):'—')+di('Parcelas',parcHtml)+di('Tipo',esc(c.tipo||'—'))+di('Cidade',esc(c.cidade||'—'))+di('Segmento',esc(c.seg||'—'))+di('Forma de pgto',c.forma?esc(c.forma):'—')+di('Contrato',c.contrato?esc(c.contrato):'—')+di('WhatsApp',c.wpp?esc(c.wpp):'—')+'</div>'+(CANW?'<div class="acts">'+(s!=='pago'&&s!=='permuta'?'<button class="ab pri" onclick="pagou(\''+id+'\')">✓ Pagou</button>':'')+(c.wpp?'<button class="ab" onclick="zap(\''+id+'\')">Cobrar</button>':'')+'<button class="ab" onclick="openForm(\''+id+'\')">Editar</button><button class="ab del" onclick="askDel(\''+id+'\')">Excluir</button></div>':'');
  document.getElementById('ov').classList.add('open');
}
function countUp(el,to){el.classList.add('bump');setTimeout(()=>{el.textContent=to;},170);setTimeout(()=>{el.classList.remove('bump');},430);}
async function pagou(id){const c=CLIENTES.find(x=>x.id===id);if(!c)return;const pg0=+c.pg||0,tt=+c.tt||0,pg=tt>0?Math.min(pg0+1,tt):pg0;const el=document.getElementById('pn');if(el&&tt>0)countUp(el,pg);const ms=document.querySelector('.mstatus');if(ms){ms.style.color='var(--green)';ms.textContent='● Pago';}try{await DB.collection('clientes').doc(id).update({pg:pg,status:'Pago',mespg:ymNow()});toast('Pago! '+(tt>0?pg+'/'+tt:''));setTimeout(()=>{if(detailId===id)closeOv();},700);}catch(e){writeErr(e);}}
function zap(id){const c=CLIENTES.find(x=>x.id===id);if(!c||!c.wpp)return;const n=(''+c.wpp).replace(/\D/g,'');window.open('https://wa.me/55'+n+'?text='+encodeURIComponent('Olá! Passando pra lembrar da mensalidade da '+c.empresa+'. 😊'),'_blank');}
function writeErr(e){console.warn('writeErr',e);toast('Erro ao salvar — tenta de novo');}
function openForm(id){editId=id||null;const c=id?CLIENTES.find(x=>x.id===id):{};const sel=(n,o,v)=>'<select class="fi" id="f-'+n+'">'+o.map(x=>'<option '+(x===v?'selected':'')+'>'+x+'</option>').join('')+'</select>';
  document.getElementById('modal').innerHTML='<h3>'+(id?'Editar cliente':'Novo cliente')+'</h3><div class="flg">Empresa / cliente</div><input class="fi" id="f-empresa" value="'+esc(c.empresa||'')+'" placeholder="Ex: Barbearia do João"><div class="ff"><div><div class="flg">Situação</div>'+sel('status',STATUSES,c.status||'Em aberto')+'</div><div><div class="flg">Tipo</div>'+sel('tipo',TIPOS,c.tipo||'Anúncio')+'</div></div><div class="ff"><div><div class="flg">Valor mensal (R$)</div><input class="fi" id="f-valor" type="number" value="'+(c.valor||'')+'"></div><div><div class="flg">Dia vencimento</div><input class="fi" id="f-venc" type="number" min="1" max="31" value="'+esc(c.venc||'')+'"></div></div><div class="ff"><div><div class="flg">Parcelas pagas</div><input class="fi" id="f-pg" type="number" value="'+(c.pg!=null?c.pg:'')+'"></div><div><div class="flg">Total parcelas</div><input class="fi" id="f-tt" type="number" value="'+(c.tt!=null?c.tt:'')+'"></div></div><div class="ff"><div><div class="flg">Cidade</div><input class="fi" id="f-cidade" value="'+esc(c.cidade||'')+'"></div><div><div class="flg">Segmento</div><input class="fi" id="f-seg" value="'+esc(c.seg||'')+'"></div></div><div class="ff"><div><div class="flg">Forma de pagamento</div>'+sel('forma',FORMAS,c.forma||'Boleto')+'</div><div><div class="flg">Tempo de contrato</div><input class="fi" id="f-contrato" value="'+esc(c.contrato||'')+'" placeholder="12 meses"></div></div><div class="flg">WhatsApp (DDD + número)</div><input class="fi" id="f-wpp" value="'+esc(c.wpp||'')+'" placeholder="48999999999"><div class="mbtns"><button class="cancel" onclick="closeOv()">Cancelar</button><button class="save" onclick="saveForm()">Salvar</button></div>';
  document.getElementById('ov').classList.add('open');
}
async function saveForm(){const g=n=>document.getElementById('f-'+n).value.trim();const obj={empresa:g('empresa'),status:g('status'),tipo:g('tipo'),valor:parseFloat(g('valor'))||0,venc:g('venc'),pg:parseInt(g('pg'))||0,tt:parseInt(g('tt'))||0,cidade:g('cidade'),seg:g('seg'),wpp:g('wpp'),forma:g('forma'),contrato:g('contrato')};if(!obj.empresa){toast('Põe o nome');return;}try{if(editId){await DB.collection('clientes').doc(editId).set(obj);toast('Salvo');}else{await DB.collection('clientes').add(obj);toast('Adicionado');}closeOv();}catch(e){writeErr(e);}}
function askDel(id){const c=CLIENTES.find(x=>x.id===id);editId=id;document.getElementById('modal').innerHTML='<h3>Excluir?</h3><p style="color:var(--muted)">Apagar <b>'+esc(c.empresa)+'</b>?</p><div class="mbtns"><button class="cancel" onclick="closeOv()">Cancelar</button><button class="del-confirm" onclick="doDel()">Excluir</button></div>';document.getElementById('ov').classList.add('open');}
async function doDel(){try{await DB.collection('clientes').doc(editId).delete();toast('Excluído');closeOv();}catch(e){writeErr(e);}}
function closeOv(){document.getElementById('ov').classList.remove('open');editId=null;detailId=null;fEditId=null;}
document.getElementById('ov').addEventListener('click',e=>{if(e.target.id==='ov')closeOv();});
</script>
</body>
</html>
